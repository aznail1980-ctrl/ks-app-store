<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 200" role="img" aria-label="쪽지 캐릭터가 손전등으로 빈 상자 안을 비춰 보는 그림. 상자 안에는 먼지 한 톨뿐">
<!-- 빈 화면(앱 없음): 손전등으로 상자를 비춰봐도 먼지 친구 하나뿐 -->
<style>
.o{fill:#fff;stroke:#23211F;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.l{fill:none;stroke:#23211F;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.d{fill:none;stroke:#23211F;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.h{fill:none;stroke:#23211F;stroke-width:1.3;stroke-linecap:round}
.r{fill:none;stroke:#23211F;stroke-width:1.2;stroke-linecap:round;opacity:.28}
.k{fill:#23211F}.w{fill:#fff}.y{fill:#FFE14D}.t{fill:#EDEBE6}
.yo{fill:#FFE14D;stroke:#23211F;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.jj path,.jj ellipse,.jj circle,.jj rect{vector-effect:non-scaling-stroke}
</style>
<defs><clipPath id="inside"><path d="M110 112L208 108L238 94L140 98Z"/></clipPath></defs>

<!-- 바닥 -->
<path class="l" d="M12 179Q130 183 250 178"/>
<path class="h" d="M118 185l-5 7M130 185l-5 7M142 185l-5 7M154 185l-5 7M166 185l-5 7M178 185l-5 7M190 185l-5 7M202 185l-5 7M214 185l-5 7M226 184l-5 7"/>

<!-- 상자 뒤 날개 -->
<path class="o" d="M140 98L157 64L251 60L238 94Z"/>
<path class="r" d="M162 72Q200 70 238 69"/>
<!-- 상자 안 (어둡게 빗금) -->
<path class="t" d="M110 112L208 108L238 94L140 98Z"/>
<g clip-path="url(#inside)"><path class="h" d="M104 98l16 16M114 96l16 16M124 94l16 16M134 92l16 16M144 92l16 16M154 92l16 16M164 92l16 16M174 92l16 16M184 92l16 16M194 92l16 16M204 90l16 16M214 90l16 16M224 90l16 16"/></g>
<!-- 상자 속 먼지 친구 -->
<path class="o" style="stroke-width:1.6" d="M196.8 103.6q.4-4.8 4.8-4.8q4.6 0 4.8 4.6q-.2 3.8-4.8 4q-4.6-.2-4.8-3.8z"/>
<circle class="k" cx="200" cy="102.8" r=".95"/><circle class="k" cx="203.4" cy="102.8" r=".95"/>

<!-- 손전등 빛 (형광펜): 손전등에서 퍼져 상자 안쪽과 뒷날개를 비춤 -->
<path class="y" style="mix-blend-mode:multiply" d="M106 101.4L222 64L248 96L214 113L106 105.4Z"/>

<!-- 상자 앞면과 옆면 -->
<path class="o" d="M110 112L208 108L206 172L112 176Z"/>
<path class="o" d="M208 108L238 94L236 158L206 172Z"/>
<path class="h" d="M216 112v50M222 108v48M228 104v48"/>
<!-- 이쪽이 위 표시 -->
<path class="d" d="M146 160v-16M141 149l5-5 5 5M164 160v-16M159 149l5-5 5 5"/>
<path class="d" d="M138 166Q156 164.6 174 165.6"/>

<!-- 쪽지: 손전등을 들고 갸웃 -->
<g class="jj" transform="translate(13.5 86.2) scale(1.3)">
  <path class="l" d="M17 57.5L16.2 66"/><path class="l" d="M33 57.5L33.8 66"/>
  <ellipse class="o" cx="14.6" cy="67.4" rx="4.8" ry="2.7"/><ellipse class="o" cx="35.4" cy="67.4" rx="4.8" ry="2.7"/>
  <path class="l" d="M3.6 34Q-3 42-2 50"/>
  <path class="l" d="M47.6 31Q56 24 60 17"/>
  <path class="o" d="M3 4Q18 2.6 34 2.2L48.5 15.5Q48 37 47.4 57.6Q25 58.8 3.4 58.2Q2.2 31 3 4Z"/>
  <path class="r" d="M9 46.5Q24 45.7 41 46.3M9 52Q22 51.5 37 51.9"/>
  <path class="yo" style="stroke-width:1.9" d="M34 2.4Q33.6 9.5 34.8 15.6Q41.5 15.9 48.3 15.4Z"/>
  <ellipse class="y" cx="11.6" cy="34.6" rx="3.9" ry="2.3"/><ellipse class="y" cx="37.4" cy="34.6" rx="3.9" ry="2.3"/>
  <ellipse class="k" cx="19" cy="28" rx="2.6" ry="3.3"/><ellipse class="k" cx="32.8" cy="28" rx="2.6" ry="3.3"/>
  <circle class="w" cx="19.9" cy="26.8" r="1"/><circle class="w" cx="33.7" cy="26.8" r="1"/>
  <ellipse class="k" cx="25.4" cy="34.8" rx="1.7" ry="2.1"/>
  <circle class="o" cx="-1.6" cy="51.4" r="3.2"/>
</g>
<!-- 손전등 (빛나는 쪽이 노랑) -->
<g transform="rotate(-6 96 104)">
  <rect class="o" style="stroke-width:2.2" x="85" y="100" width="16" height="8.4" rx="2"/>
  <path class="yo" style="stroke-width:2" d="M101 98.4h4.6v11.6H101z"/>
</g>
<circle class="o" cx="92.5" cy="106.5" r="3.2"/>

<!-- 낙서 -->
<path class="d" d="M60 40v10M55 45h10"/>
<path class="d" d="M232 30v12M226 36h12M227.8 31.8l8.4 8.4M236.2 31.8l-8.4 8.4"/>
<circle class="k" cx="120" cy="58" r="1.8"/>
</svg>
