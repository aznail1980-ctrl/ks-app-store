<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 190" role="img" aria-label="아이폰 사파리 아래쪽 공유 버튼을 누르고, 열린 목록에서 홈 화면에 추가를 고르는 그림">
