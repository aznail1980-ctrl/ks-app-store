.k{fill:#23211F}.y{fill:#FFE14D}
.mk{fill:none;stroke:#FFE14D;stroke-width:9;stroke-linecap:round;stroke-linejoin:round}
.tx{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;font-size:13px;font-weight:600;fill:#23211F}
