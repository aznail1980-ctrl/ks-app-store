# KS 앱스토어 — 초간단 가이드 · AI 소개 자동 만들기
# 매일 새벽 3시(한국 시간)에 앱마다 화면을 찍어 보고, 바뀐 앱만 AI가 가이드와 소개를 새로 씁니다.
# 손으로 돌리기: GitHub 저장소 → Actions → 이 작업 → Run workflow
# 필요한 비밀값(Settings → Secrets and variables → Actions):
#   FIREBASE_SERVICE_ACCOUNT  (필수) Firebase 서비스 계정 키 파일 내용
#   GEMINI_API_KEY            (선택) 없으면 앱스토어 관리 → 설정에 넣은 키를 씀
#   APP_SESSIONS              (선택) 로그인 앱의 '한 번 로그인' 기록. 내 맥에서 scripts/record-logins.mjs 로 만듦
# ⚠️ 저장소가 공개라 실행 기록도 공개됩니다. 스크립트는 앱 이름·주소를 기록에 남기지 않습니다.
name: 앱 가이드·소개 자동 만들기

on:
  schedule:
    - cron: "0 18 * * *"          # 매일 18:00 UTC = 한국 시간 새벽 3시
  workflow_dispatch:
    inputs:
      force:
        description: "바뀐 게 없어도 전부 새로 만들기"
        type: boolean
        default: false
      only_app:
        description: "한 앱만 (앱 ID 또는 이름 일부 · 비우면 전체)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: app-guides
  cancel-in-progress: false

jobs:
  guides:
    # 2026-10-27: ubuntu-latest 가 26.04로 바뀌며 화면 찍는 도구(Playwright) 준비가 실패 → 지원되는 24.04로 고정
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: 준비물 설치
        working-directory: scripts
        timeout-minutes: 15
        run: |
          npm install --no-audit --no-fund --loglevel=error
          npx playwright install --with-deps chromium > /dev/null

      # 2026-10-26: apt 로 한글 글꼴을 받다가 23분이 걸려 시간 초과 → 글꼴 파일만 바로 받음 (몇 초). 실패할 때만 apt 로
      - name: 한글 글꼴 설치 (화면 사진의 한글이 네모로 깨지지 않게)
        timeout-minutes: 10
        run: |
          mkdir -p ~/.local/share/fonts
          # 이모지 글꼴은 위 '준비물 설치'(playwright --with-deps)가 함께 설치함
          if ! curl -fsSL --retry 3 --max-time 120 -o ~/.local/share/fonts/NotoSansKR.ttf "https://github.com/google/fonts/raw/main/ofl/notosanskr/NotoSansKR%5Bwght%5D.ttf"; then
            sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends fonts-noto-cjk > /dev/null
          fi
          fc-cache -f > /dev/null
          if fc-list | grep -qi "Noto Sans KR\|Noto Sans CJK"; then echo "한글 글꼴 준비됨"; else echo "::warning::한글 글꼴을 찾지 못했어요. 사진의 한글이 깨질 수 있어요."; fi

      - name: 가이드 만들기
        working-directory: scripts
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          APP_SESSIONS: ${{ secrets.APP_SESSIONS }}
          FORCE: ${{ inputs.force }}
          ONLY_APP: ${{ inputs.only_app }}
        run: node update-guides.mjs
