}[e?.code] || [null, "잠시 문제가 생겼어요. 다시 시도해 주세요."]);
const validEmail = v => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v);

const App = {
  /* 로그인·가입 */
  authMode(m) { S.authMode = m; renderLogin(); },
  login: btn => busy(btn, async () => {
    const f = $("#auth-form"); clearErrs(f);
    const email = gv("au-email").trim(), pw = gv("au-pw");
    if (!email) setErr("au-email", "이메일을 적어 주세요."); else if (!validEmail(email)) setErr("au-email", "이메일 형식이 맞지 않아요. 예: name@example.com");
    if (!pw) setErr("au-pw", "비밀번호를 적어 주세요.");
    if (f.querySelector(".has-err")) return focusFirstErr(f);
    $("#au-remember")?.checked ? store.set(REMEMBER_KEY, email) : store.del(REMEMBER_KEY);
    try { await signInWithEmailAndPassword(auth, email, pw); }
    catch (e) { const [fid, m] = authMsg(e); fid ? (setErr(fid, m), focusFirstErr(f)) : toast(m, "bad"); }
  }),
  signup: btn => busy(btn, async () => {
    const f = $("#auth-form"); clearErrs(f);
    const name = gv("au-name").trim(), email = gv("au-email").trim(), pw = gv("au-pw"), pw2 = gv("au-pw2");
    if (!name) setErr("au-name", "이름을 적어 주세요.");
    if (!email) setErr("au-email", "이메일을 적어 주세요."); else if (!validEmail(email)) setErr("au-email", "이메일 형식이 맞지 않아요. 예: name@example.com");
    if (pw.length < 6) setErr("au-pw", "비밀번호는 6자 이상이어야 해요.");
    if (pw && pw !== pw2) setErr("au-pw2", "위 비밀번호와 똑같이 적어 주세요.");
    if (f.querySelector(".has-err")) return focusFirstErr(f);
    SIGNING_UP = true;   // 가입 중에는 회원 문서를 두 번 만들지 않게
    try {
      const cred = await createUserWithEmailAndPassword(auth, email, pw);
      await updateProfile(cred.user, { displayName: name });
      const admin = isAdminEmail(email);
      await setDoc(doc(db, "users", cred.user.uid), { uid: cred.user.uid, email, displayName: name, role: admin ? "admin" : "user", status: admin ? "approved" : "pending", createdAt: serverTimestamp() });
    } catch (e) { const [fid, m] = authMsg(e); fid ? (setErr(fid, m), focusFirstErr(f)) : toast(m, "bad"); }
    finally { SIGNING_UP = false; }
  }),
  resetPw: btn => busy(btn, async () => {
    const f = $("#auth-form"); clearErrs(f);
    const email = gv("au-email").trim();
    if (!validEmail(email)) { setErr("au-email", "재설정 메일을 받을 이메일을 먼저 적어 주세요."); return focusFirstErr(f); }
    try { await sendPasswordResetEmail(auth, email); toast(`${email}(으)로 재설정 메일을 보냈어요. 스팸함도 확인해 주세요.`); }
    catch (e) { const [fid, m] = authMsg(e); fid ? setErr(fid, m) : toast(m, "bad"); }
  }),
  togglePw(btn, id) {
    const inp = document.getElementById(id); const show = inp.type === "password";
    inp.type = show ? "text" : "password";
    btn.setAttribute("aria-pressed", String(show)); btn.setAttribute("aria-label", show ? "비밀번호 숨기기" : "비밀번호 보기");
    btn.innerHTML = icon(show ? "i-eye-off" : "i-eye");
  },
  logout: btn => busy(btn, async () => { await signOut(auth); toast("로그아웃했어요."); }),

  /* 이동 */
  openDetail: id => openDetail(id),
  setCat(c) {
    S.cat = c;
    if (S.tab === "search") { paintSearch(true); return; }
    document.querySelectorAll(".tabs .tab").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.cat === c)));
    const box = $("#home-list"); if (box) box.innerHTML = homeList(visibleApps());
  },
  retry() { S.rendered = null; route(); },
  icoNext(img) {
    const s = JSON.parse(img.dataset.srcs || "[]");
    if (s.length) { img.src = s.shift(); img.dataset.srcs = JSON.stringify(s); } else img.remove();
  },
  // 아이콘을 못 찾으면 16px짜리 기본 그림이 오는 경우가 있어, 너무 작으면 다음 후보로
  icoCheck(img) { if (img.naturalWidth && img.naturalWidth < 32) App.icoNext(img); },

  /* 찾기 */
  onSearch: debounce(v => {
    S.q = v; const c = $("#q-clear"); if (c) c.hidden = !v; paintSearch();
  }, 120),
  clearSearch() { S.q = ""; const q = $("#q"); if (q) { q.value = ""; q.focus(); } $("#q-clear").hidden = true; paintSearch(); },
  saveRecent() {
    const w = S.q.trim(); if (!w) return;
    const list = [w, ...JSON.parse(store.get(RECENT_KEY) || "[]").filter(x => x !== w)].slice(0, 8);
    store.set(RECENT_KEY, JSON.stringify(list));
  },
  useRecent(w) { S.q = w; const q = $("#q"); if (q) q.value = w; $("#q-clear").hidden = false; paintSearch(); },
  delRecent(w) { store.set(RECENT_KEY, JSON.stringify(JSON.parse(store.get(RECENT_KEY) || "[]").filter(x => x !== w))); paintSearch(); },
  clearRecent() { store.del(RECENT_KEY); paintSearch(); },

  /* 앱 받기·열기 */
  getApk(id) {
    const ap = findApp(id); if (!ap?.apkUrl) return;
    const u = directApkUrl(safeUrl(ap.apkUrl));
    if (u === "#") { toast("APK 주소가 올바르지 않아요. 관리자에게 알려 주세요.", "bad"); return; }
    if (isIOS()) { apkGuide(ap); return; }
    if (isInApp()) { inAppWarn(u); return; }
    window.open(u, "_blank", "noopener");
    apkGuide(ap, { justDownloaded: true });
  },
  apkGuide(id) { const ap = findApp(id); if (ap) apkGuide(ap); },
  guideApp(id) { const ap = findApp(id); if (ap) guideA2HS(ap); },
  guideStore() { guideA2HS(null); },

  /* 후기 */
  paintStars(form) { const v = +(form.querySelector('input[name="rv-star"]:checked')?.value || 0); form.querySelectorAll(".star-pick label").forEach((l, i) => l.classList.toggle("on", i < v)); setErr("rv-s1", ""); },
  submitReview(form) {
    const btn = form.querySelector('[type="submit"]');
    return busy(btn, async () => {
      clearErrs(form);
      const id = form.dataset.id, rating = +(form.querySelector('input[name="rv-star"]:checked')?.value || 0), text = gv("rv-txt").trim();
      if (!rating) { const fs = form.querySelector("fieldset"); fs.classList.add("has-err"); fs.querySelector(".err span").textContent = "별점을 골라 주세요."; }
      if (!text) setErr("rv-txt", "한 줄이라도 적어 주세요.");
      if (form.querySelector(".has-err")) { (rating ? $("#rv-txt") : $("#rv-s1"))?.focus(); return; }
      const mine = (S.reviews[id] || []).find(r => r.userId === S.me.uid);
      try {
        await saveReview(id, rating, text, mine);
        S.rvEdit = null;
        toast(mine ? "후기를 고쳤어요." : "후기를 남겼어요. 고마워요!");
        const s = topSheet("detail"); const ap = findApp(id); if (s && ap) paintReviews(s, ap);
      } catch (e) { console.warn(e); toast("후기를 저장하지 못했어요. 잠시 뒤 다시 해 주세요.", "bad"); }
    });
  },
  editReview(id) { S.rvEdit = id; const s = topSheet("detail"), ap = findApp(id); if (s && ap) paintReviews(s, ap); setTimeout(() => $("#rv-txt")?.focus(), 50); },
  cancelEdit(id) { S.rvEdit = null; const s = topSheet("detail"), ap = findApp(id); if (s && ap) paintReviews(s, ap); },
  async delMyReview(id, btn) {
    const mine = (S.reviews[id] || []).find(r => r.userId === S.me.uid); if (!mine) return;
    if (!await confirmSheet({ title: "내 후기를 지울까요?", text: "지우면 되돌릴 수 없어요.", ok: "후기 지우기", danger: true })) return;
    await busy(btn, async () => {
      try { await removeReview(mine); toast("후기를 지웠어요."); const s = topSheet("detail"), ap = findApp(id); if (s && ap) paintReviews(s, ap); }
      catch { toast("지우지 못했어요. 잠시 뒤 다시 해 주세요.", "bad"); }
    });
  },
  async adminDelReview(rid, btn) {
    const r = S.allReviews.find(x => x.id === rid) || Object.values(S.reviews).flat().find(x => x.id === rid); if (!r) return;
    if (!await confirmSheet({ title: "이 후기를 지울까요?", text: `${esc(r.userName || "회원")}님의 후기를 지워요. 되돌릴 수 없어요.`, ok: "후기 지우기", danger: true })) return;
    await busy(btn, async () => {
      try {
        await removeReview(r); toast("후기를 지웠어요.");
        S.allReviews = S.allReviews.filter(x => x.id !== rid);
        const s = topSheet("detail"), ap = findApp(r.appId); if (s && ap && s.appId === r.appId) paintReviews(s, ap);
        if (S.tab === "admin") { S.rendered = null; route(); }
      } catch { toast("지우지 못했어요. 잠시 뒤 다시 해 주세요.", "bad"); }
    });
  },

  /* 내 정보 */
  saveName: btn => busy(btn, async () => {
    const f = btn.form; clearErrs(f);
    const name = gv("me-name").trim();
    if (!name) { setErr("me-name", "이름을 적어 주세요."); return focusFirstErr(f); }
    if (name === S.meData?.displayName) { toast("바뀐 내용이 없어요."); return; }
    try {
      if (auth.currentUser) await updateProfile(auth.currentUser, { displayName: name });
      await updateDoc(doc(db, "users", S.me.uid), { displayName: name });
      S.meData.displayName = name; toast("이름을 바꿨어요."); S.rendered = null; route();
    } catch { toast("저장하지 못했어요. 잠시 뒤 다시 해 주세요.", "bad"); }
  }),

  /* 관리: 앱 */
  appForm: id => appForm(id),
  formKind() { const apk = $("#k-apk").checked; document.querySelector('[data-kind="web"]').hidden = apk; document.querySelector('[data-kind="apk"]').hidden = !apk; iconPreview(); },
  iconPreview: debounce(() => iconPreview(), 300),
  async iconFile(input) {
    const file = input.files?.[0]; if (!file) return;
    if (!file.type.startsWith("image/")) { toast("이미지 파일만 올릴 수 있어요.", "bad"); return; }
    try { FORM_ICON = await compressImage(file); $("#f-ico").value = ""; iconPreview(); toast("아이콘 이미지를 골랐어요. 저장해야 반영돼요."); }
    catch { toast("이미지를 읽지 못했어요. 다른 파일로 해 주세요.", "bad"); }
  },
  iconText(v) { FORM_ICON = v.trim(); iconPreview(); },
  iconAuto() { FORM_ICON = ""; $("#f-ico").value = ""; iconPreview(); },
  saveApp(form) {
    const btn = document.querySelector('[form="app-form"][type="submit"]');
    return busy(btn, async () => {
      clearErrs(form);
      const id = form.dataset.id, apk = $("#k-apk").checked;
      const d = {
        name: gv("f-name").trim(), category: gv("f-cat") || "기타",
        url: apk ? "" : gv("f-url").trim(), apkUrl: apk ? gv("f-apk").trim() : "",
        customIcon: FORM_ICON || "", description: gv("f-desc").trim(),
        features: gv("f-feat").split(/[,，、]/).map(s => s.trim()).filter(Boolean).slice(0, 12),
        featured: $("#f-featured").checked, hidden: $("#f-hidden").checked,
      };
      if (!d.name) setErr("f-name", "앱 이름을 적어 주세요.");
      if (!apk && safeUrl(d.url) === "#") setErr("f-url", "https:// 로 시작하는 주소를 적어 주세요.");
      if (apk && safeUrl(d.apkUrl) === "#") setErr("f-apk", "https:// 로 시작하는 받기 주소를 적어 주세요.");
      if (!d.description) setErr("f-desc", "어떤 앱인지 한 줄이라도 적어 주세요.");
      if (form.querySelector(".has-err")) return focusFirstErr(form);
      try {
        let appId = id;
        if (id) await updateDoc(doc(db, "apps", id), d);
        else appId = (await addDoc(collection(db, "apps"), { ...d, rating: 0, reviewCount: 0, createdAt: serverTimestamp() })).id;
        if (d.featured) for (const a of S.apps.filter(a => a.featured && a.id !== appId)) await updateDoc(doc(db, "apps", a.id), { featured: false });
        toast(id ? "고친 내용을 저장했어요." : "앱을 올렸어요.");
        closeSheet(topSheet("form").id);
        await loadApps(true);
        const ap = findApp(appId); if (ap) summaryFor(ap).catch(() => {});   // AI 소개는 뒤에서 미리 만들어 둠
        S.rendered = null; route();
      } catch (e) { console.warn(e); toast("저장하지 못했어요. 잠시 뒤 다시 해 주세요.", "bad"); }
    });
  },
  appMore(id) {
    const ap = findApp(id); if (!ap) return;
    const s = openSheet({
      kind: "menu", title: ap.name,
      body: `<div class="menu-list">
        <button type="button" class="menu-item" data-act="feature">${icon("i-pin")}<span>${ap.featured ? "추천에서 빼기" : "이번 주 추천으로 올리기"}</span></button>
        <button type="button" class="menu-item" data-act="hide">${icon(ap.hidden ? "i-eye" : "i-eye-off")}<span>${ap.hidden ? "다시 보이게 하기" : "사용자에게 숨기기"}</span></button>
        <button type="button" class="menu-item" data-act="ai">${icon("i-ai")}<span>AI 소개 다시 만들기</span></button>
        <button type="button" class="menu-item" data-act="view">${icon("i-chev")}<span>상세 화면으로 보기</span></button>
        <button type="button" class="menu-item menu-danger" data-act="del">${icon("i-trash")}<span>앱 지우기</span></button></div>`
    });
    s.el.querySelector(".menu-list").addEventListener("click", async e => {
      const b = e.target.closest("[data-act]"); if (!b) return;
      const act = b.dataset.act;
      if (act === "view") { closeSheet(s.id); setTimeout(() => openDetail(id), 300); return; }
      if (act === "del") {
        closeSheet(s.id);
        if (!await confirmSheet({ title: `‘${esc(ap.name)}’을(를) 지울까요?`, text: "앱 목록에서 사라지고 되돌릴 수 없어요. 잠시 내리려면 ‘사용자에게 숨기기’를 쓰세요.", ok: "앱 지우기", danger: true })) return;
        try { await deleteDoc(doc(db, "apps", id)); toast("앱을 지웠어요."); await loadApps(true); S.rendered = null; route(); }
        catch { toast("지우지 못했어요. 잠시 뒤 다시 해 주세요.", "bad"); }
        return;
      }
      await busy(b, async () => {
        try {
          if (act === "feature") {
            const on = !ap.featured;
            if (on) for (const a of S.apps.filter(a => a.featured && a.id !== id)) await updateDoc(doc(db, "apps", a.id), { featured: false });
            await updateDoc(doc(db, "apps", id), { featured: on }); toast(on ? "이번 주 추천으로 올렸어요." : "추천에서 뺐어요.");
          } else if (act === "hide") {
            await updateDoc(doc(db, "apps", id), { hidden: !ap.hidden }); toast(ap.hidden ? "다시 보이게 했어요." : "사용자에게 숨겼어요. 관리자만 볼 수 있어요.");
          } else if (act === "ai") {
            const t = await summaryFor(ap, { force: true }); toast(t ? "AI 소개를 새로 만들었어요." : "AI 소개를 만들지 못했어요. 설정에서 AI 연결을 확인해 주세요.", t ? "" : "bad");
          }
          closeSheet(s.id); await loadApps(true); S.rendered = null; route();
        } catch (e) { console.warn(e); toast("처리하지 못했어요. 잠시 뒤 다시 해 주세요.", "bad"); }
      });
    });
  },

  /* 관리: 회원 */
  async setUser(uid, st, btn) {
    const u = S.users.find(x => x.uid === uid); if (!u) return;
    if (st === "rejected" && !await confirmSheet({ title: `${esc(u.displayName || "이 회원")}님을 ${u.status === "approved" ? "내보낼까요" : "거절할까요"}?`, text: "앱스토어에 들어올 수 없게 돼요. 나중에 ‘다시 들여보내기’로 되돌릴 수 있어요.", ok: u.status === "approved" ? "내보내기" : "거절하기", danger: true })) return;
    await busy(btn, async () => {
      try { await updateDoc(doc(db, "users", uid), { status: st }); toast(st === "approved" ? `${u.displayName || "회원"}님을 들여보냈어요.` : "처리했어요."); S.rendered = null; route(); }
      catch { toast("처리하지 못했어요. 잠시 뒤 다시 해 주세요.", "bad"); }
    });
  },

  /* 관리: 설정 */
  saveAiKey: btn => busy(btn, async () => {
    const f = btn.form; clearErrs(f);
    const k = gv("set-key").trim();
    if (!/^AIza[\w-]{20,}$/.test(k)) { setErr("set-key", "AIza로 시작하는 Gemini API 키를 붙여 넣어 주세요."); return focusFirstErr(f); }
    try { await setDoc(doc(db, "config", "ai"), { geminiKey: k, updatedAt: serverTimestamp() }); S.aiKey = k; toast("AI 키를 저장했어요."); S.rendered = null; route(); }
    catch { toast("저장하지 못했어요. Firestore 규칙이 최신인지 확인해 주세요.", "bad"); }
  }),
  testAi: btn => busy(btn, async () => {
    const t = await gemini("'연결 확인'이라고만 답해 주세요.");
    t ? toast("AI가 잘 연결돼 있어요.") : toast("AI가 응답하지 않아요. 키와 사용처 제한을 확인해 주세요.", "bad");
  }),
  async copy(text, btn) {
    try { await navigator.clipboard.writeText(text); toast("복사했어요."); }
    catch { window.prompt?.("아래 주소를 길게 눌러 복사해 주세요.", text); }
  },

  /* AI 도우미 */
  openChat: () => openChat(),
  askSuggest(t) { const i = $("#chat-in"); if (i) { i.value = t; App.sendChat(i.form); } },
  async sendChat(form) {
    if (CHAT_BUSY) return;
    const inp = form.querySelector("input"), text = inp.value.trim(); if (!text) return;
    CHAT_BUSY = true; inp.value = "";
    CHAT_LOG.push({ who: "me", text });
    const wait = { who: "bot", text: "찾아보는 중…", wait: true }; CHAT_LOG.push(wait); paintChat();
    try {
      await loadApps();
      const r = await recommend(text);
      wait.wait = false;
      if (!r) wait.text = S.aiKey === "" ? "AI가 아직 연결되지 않았어요. 관리자에게 알려 주세요." : "AI가 잠시 쉬고 있어요. 조금 뒤 다시 물어봐 주세요.";
      else { wait.text = r; wait.apps = visibleApps().filter(a => r.toLowerCase().includes(a.name.toLowerCase())).map(a => a.id).slice(0, 4); }
    } catch { wait.wait = false; wait.text = "답을 가져오지 못했어요. 다시 물어봐 주세요."; }
    finally { CHAT_BUSY = false; paintChat(); $("#chat-in")?.focus(); }
  },
};
window.App = App;

/* ╔══════════════════════════════════════════════════════════╗
   ║  15. 시작 — 로그인 상태를 보고 화면 결정                   ║
   ╚══════════════════════════════════════════════════════════╝ */
function resetSession() {
  closeAllSheets();
  Object.assign(S, { me: null, meData: null, apps: [], appsLoaded: false, users: [], allReviews: [], reviews: {}, shell: false, rendered: null, aiKey: undefined, rvEdit: null, cat: "전체", q: "" });
  CHAT_LOG.length = 0;
}
function routeByStatus() {
  if (S.meData.status === "pending") renderStatus("pending");
  else if (S.meData.status === "rejected") renderStatus("rejected");
  else enterApp();
}
window.addEventListener("offline", () => { const o = $("#offline"); if (o) o.hidden = false; });
window.addEventListener("online", () => { const o = $("#offline"); if (o && !o.hidden) { o.hidden = true; toast("다시 연결됐어요."); } });

onAuthStateChanged(auth, async user => {
  if (UNSUB_USER) { UNSUB_USER(); UNSUB_USER = null; }
  LAST_STATUS = null;
  if (!user) { resetSession(); hideSplash(); renderLogin(); movedNotice(); return; }
  S.me = user;
  if (!SIGNING_UP) { try { await ensureUserDoc(user); } catch (e) { console.warn(e); } }
  // 회원 문서를 실시간으로 지켜봄 — 관리자가 승인하면 다시 로그인하지 않아도 바로 들어감
  UNSUB_USER = onSnapshot(doc(db, "users", user.uid), snap => {
    if (!snap.exists()) return;
    const prevRole = S.meData?.role;
    S.meData = snap.data();
    hideSplash();
    // 관리자 이메일인데 회원 정보가 아직 '일반 회원'이면 스스로 관리자로 고쳐 둠
    if (isAdminEmail(user.email) && (S.meData.role !== "admin" || S.meData.status !== "approved")) {
      updateDoc(doc(db, "users", user.uid), { role: "admin", status: "approved" }).catch(e => console.warn("관리자 지정 실패", e));
    }
    if (S.meData.status !== LAST_STATUS) { LAST_STATUS = S.meData.status; routeByStatus(); }
    else if (prevRole && prevRole !== S.meData.role && S.shell) { S.shell = false; enterApp(); }  // 권한이 바뀌면 메뉴 다시 그림
  }, err => { console.warn(err); hideSplash(); toast("회원 정보를 불러오지 못했어요. 새로고침해 주세요.", "bad"); });
});
</script>
</body>
</html>
